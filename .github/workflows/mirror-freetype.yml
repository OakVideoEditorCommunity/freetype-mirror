name: Mirror freetype release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'freetype version to mirror (e.g. 2.13.3)'
        required: true
        default: '2.13.3'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Download from upstream (official savannah mirror redirector)
        run: |
          curl -fSL --retry 5 --retry-delay 5 --retry-all-errors \
            -o "freetype-${{ inputs.version }}.tar.xz" \
            "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-${{ inputs.version }}.tar.xz"

      - name: Verify the tarball
        run: |
          xz -t "freetype-${{ inputs.version }}.tar.xz"
          tar -tJf "freetype-${{ inputs.version }}.tar.xz" | head -3
          sha256sum "freetype-${{ inputs.version }}.tar.xz"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ inputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping"
            exit 0
          fi
          gh release create "$tag" \
            --title "freetype ${{ inputs.version }}" \
            --notes "Unmodified mirror of https://download.savannah.gnu.org/releases/freetype/freetype-${{ inputs.version }}.tar.xz" \
            "freetype-${{ inputs.version }}.tar.xz"
